name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # Every tracked script; .shellcheckrc at the root lets it follow the
      # sourced libs.
      - name: Lint shell scripts
        run: git ls-files '*.sh' '*.bash' | xargs shellcheck

  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq
      - name: Diag
        run: |
          command -v python3 bash; ls -l "$(command -v python3)"; python3 -c 'import sys; print(sys.version, sys.executable)'; bash --version | head -1
          d=$(mktemp -d); ln -s "$(command -v python3)" "$d/python3"; PATH="$d" HOME="$d" "$d/python3" -c 'print("ok")'; echo "exit $?"
      - name: Run bats
        env:
          BATS_TEST_TIMEOUT: 120
        run: bats --print-output-on-failure -f 'codex|one seat|start detaches' tests
